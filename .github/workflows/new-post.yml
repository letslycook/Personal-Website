name: New blog post

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Post title"
        required: true
        type: string
      tags:
        description: "Comma-separated tags (optional)"
        required: false
        type: string
      category:
        description: "Category (optional)"
        required: false
        type: string
      body:
        description: "Markdown body"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create_post:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow repo owner
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "Not authorized."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Create post file
        env:
          POST_TITLE: ${{ inputs.title }}
          POST_BODY: ${{ inputs.body }}
          POST_TAGS: ${{ inputs.tags }}
          POST_CATEGORY: ${{ inputs.category }}
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import date

          title = os.environ.get("POST_TITLE", "").strip()
          body  = (os.environ.get("POST_BODY", "") or "").rstrip() + "\n"
          tags  = os.environ.get("POST_TAGS", "").strip()
          cat   = os.environ.get("POST_CATEGORY", "").strip()

          def slugify(s):
              s = s.lower()
              s = re.sub(r"[^a-z0-9\s-]", "", s)
              s = re.sub(r"\s+", "-", s.strip())
              s = re.sub(r"-{2,}", "-", s)
              return s or "post"

          slug = slugify(title)
          filename = f"_posts/{date.today().isoformat()}-{slug}.md"

          safe_title = title.replace("\\", "\\\\").replace('"', '\\"')

          fm = [
              "---",
              f'title: "{safe_title}"',
              f"date: {date.today().isoformat()}",
          ]

          if cat:
              fm.append(f"categories: [{cat}]")
          if tags:
              tag_list = [t.strip() for t in tags.split(",") if t.strip()]
              fm.append("tags: [" + ", ".join(tag_list) + "]")

          fm += ["toc: true", "toc_sticky: true", "---", ""]

          os.makedirs("_posts", exist_ok=True)
          with open(filename, "w", encoding="utf-8") as f:
              f.write("\n".join(fm) + body)

          print("Created", filename)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/*.md
          git commit -m "Add post: ${{ inputs.title }}" || exit 0
          git push
